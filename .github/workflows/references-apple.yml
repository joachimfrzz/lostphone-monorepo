# Références « vraies apps Apple » capturées sur le simulateur (D95).
# Le robot (outils/explorateur) ouvre chaque app Apple du simulateur iPhone 17
# (iOS 26, français, barre d'état figée), appuie sur chaque bouton visible et
# capture chaque écran. Zéro travail pour Joachim.
# Une tâche par app, en parallèle ; chaque tâche publie son artefact même si elle est coupée.
# Repo public → minutes macOS GitHub gratuites (pas de quota Codemagic).
name: references-apple

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Bundle IDs séparés par des virgules (vide = outils/explorateur/apps.txt)"
        required: false
        default: ""
      profondeur:
        description: "Nombre d'appuis enchaînés"
        required: false
        default: "2"
      max_ecrans:
        description: "Plafond d'écrans par app"
        required: false
        default: "80"
  push:
    branches: ["kiro/**"]
    paths:
      - ".github/workflows/references-apple.yml"
      - "outils/explorateur/**"

jobs:
  inventaire:
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      apps: ${{ steps.liste.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: liste
        name: Apps présentes sur le simulateur iPhone 17
        env:
          APPS: ${{ inputs.apps }}
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-26-[0-9]+' | sort -t- -k3 -n | tail -1)
          UDID=$(xcrun simctl create "LP-iPhone17" com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$RUNTIME")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl listapps "$UDID" | grep -oE 'CFBundleIdentifier = "?[A-Za-z0-9.-]+' | sed -E 's/.*= "?//' | sort -u > installees.txt
          echo "================ APPS INSTALLÉES ($RUNTIME) ================"; cat installees.txt
          [ -z "$APPS" ] && APPS=$(grep -v '^#' outils/explorateur/apps.txt | grep . | paste -sd, -)
          RET=""
          for a in $(echo "$APPS" | tr ',' ' '); do
            if grep -qx "$a" installees.txt; then RET="$RET\"$a\","; else echo "ABSENTE du simulateur : $a"; fi
          done
          echo "apps=[${RET%,}]" >> "$GITHUB_OUTPUT"
          echo "Apps explorées : [${RET%,}]"

  explorer:
    needs: inventaire
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        app: ${{ fromJSON(needs.inventaire.outputs.apps) }}
    env:
      PROFONDEUR: ${{ inputs.profondeur || '2' }}
      MAX_ECRANS: ${{ inputs.max_ecrans || '80' }}
    steps:
      - uses: actions/checkout@v4

      - name: Simulateur iPhone 17, iOS 26 le plus récent, français
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-26-[0-9]+' | sort -t- -k3 -n | tail -1)
          echo "Runtime : $RUNTIME"
          UDID=$(xcrun simctl create "LP-iPhone17" com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array fr-FR
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string fr_FR
          xcrun simctl shutdown "$UDID"; xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100
          echo "SORTIE=$RUNNER_TEMP/references-apple" >> "$GITHUB_ENV"

      - name: Générer le projet du robot
        run: |
          brew install xcodegen || (brew update && brew install xcodegen)
          cd outils/explorateur && xcodegen generate

      - name: Explorer ${{ matrix.app }}
        run: |
          mkdir -p "$SORTIE"
          TEST_RUNNER_SORTIE="$SORTIE" TEST_RUNNER_APPS="${{ matrix.app }}" \
          TEST_RUNNER_PROFONDEUR="$PROFONDEUR" TEST_RUNNER_MAX_ECRANS="$MAX_ECRANS" TEST_RUNNER_DUREE_MAX=2700 TEST_RUNNER_PAGES=4 \
          xcodebuild test -project outils/explorateur/Explorateur.xcodeproj -scheme Explorateur \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error|Executed|TEST" || true
          echo "Captures : $(find "$SORTIE" -name '*.png' | wc -l)"
          cat "$SORTIE"/*/INDEX.tsv || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ref-${{ matrix.app }}
          path: ${{ env.SORTIE }}
          if-no-files-found: warn
