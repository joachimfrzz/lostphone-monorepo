# Canal TestFlight — jalon-duel D49 (Flutter vs Swift)
# CANAL PRINCIPAL (décision 2026-08-10) : réutilise l'infrastructure Codemagic existante
# de l'ancienne piste SwiftUI — intégration App Store Connect « Codemagic » déjà configurée,
# Bundle ID existant com.lostphone.game (fiche app + TestFlight déjà actifs).
# Fallback : .github/workflows/testflight.yml (manuel, nécessite les secrets ASC_*).
#
# Numéros de build : décalés de +100 pour ne jamais entrer en collision avec les
# builds 1-27 de l'ancienne app SwiftUI sur la même fiche TestFlight.

workflows:
  duel-flutter-testflight:
    name: Duel D49 — Flutter TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lostphone.game
      flutter: stable
      xcode: latest
      vars:
        APP_DIR: "moteur"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Restaurer les fichiers binaires (icônes)
        script: |
          bash outils/decode-binaires.sh

      - name: Dépendances Flutter
        script: |
          cd $APP_DIR
          flutter pub get

      - name: Signature (profils via intégration App Store Connect)
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd $APP_DIR
          flutter build ipa --release \
            --build-number=$((100 + PROJECT_BUILD_NUMBER)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - moteur/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ——————————————————————————— Prétendant SwiftUI (duel D49) ———————————————————————————
  # Lancement MANUEL uniquement (Start new build → ce workflow).
  # Builds numérotés 2xx (Flutter = 1xx) : les deux prétendants coexistent dans TestFlight,
  # on bascule de l'un à l'autre via « Versions précédentes ».
  duel-swift-testflight:
    name: Duel D49 — Swift TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lostphone.game
      xcode: latest

    scripts:
      - name: Restaurer les fichiers binaires (icônes)
        script: |
          bash outils/decode-binaires.sh

      - name: Icône de l'app Swift (réutilise la 1024 du proto Flutter)
        script: |
          cp moteur/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png \
             proto-swift/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Installer XcodeGen
        script: |
          brew install xcodegen || (brew update && brew install xcodegen)
          xcodegen --version

      - name: Générer le projet Xcode
        script: |
          cd proto-swift
          xcodegen generate

      - name: Numéro de build (série 2xx)
        script: |
          cd proto-swift
          agvtool new-version -all $((200 + BUILD_NUMBER))

      - name: Signature (profils via intégration App Store Connect)
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project proto-swift/LPProtoSwift.xcodeproj \
            --scheme LPProtoSwift

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ——————————————————————————— Pipeline Miroir (D63) ———————————————————————————
  # Lancement MANUEL. Ne publie RIEN sur TestFlight : construit l'app pour le
  # simulateur iPhone, la lance écran par écran (variable ECRAN, registre
  # outils/ecrans.txt) et photographie chaque écran. Artefact : captures.zip —
  # à transmettre dans le fil pour la comparaison pixel avec les références.
  miroir-captures:
    name: Miroir D63 — captures simulateur
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Restaurer les fichiers binaires (photos, mémos, icônes)
        script: |
          bash outils/decode-binaires.sh

      - name: Icône de l'app Swift (réutilise la 1024 du proto Flutter)
        script: |
          cp moteur/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png \
             proto-swift/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Installer XcodeGen + générer le projet
        script: |
          brew install xcodegen || (brew update && brew install xcodegen)
          cd proto-swift
          xcodegen generate

      - name: Build simulateur (non signé)
        script: |
          xcodebuild -project proto-swift/LPProtoSwift.xcodeproj \
            -scheme LPProtoSwift -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_sim \
            CODE_SIGNING_ALLOWED=NO build

      - name: Captures écran par écran
        script: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone (16|17)" | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          fi
          echo "Simulateur : $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build_sim/Build/Products -name "LPProtoSwift.app" -type d | head -1)
          echo "App : $APP"
          xcrun simctl install "$UDID" "$APP"
          DOSSIER="$PWD/captures"
          mkdir -p "$DOSSIER"
          while IFS= read -r ecran; do
            [ -z "$ecran" ] && continue
            echo "— Capture : $ecran"
            SIMCTL_CHILD_ECRAN="$ecran" xcrun simctl launch "$UDID" com.lostphone.game
            sleep 5
            xcrun simctl io "$UDID" screenshot "$DOSSIER/${ecran}.png"
            xcrun simctl terminate "$UDID" com.lostphone.game || true
            sleep 1
          done < outils/ecrans.txt
          ls -la "$DOSSIER"
          ATTENDU=$(grep -c . outils/ecrans.txt)
          OBTENU=$(ls "$DOSSIER" | wc -l | tr -d ' ')
          echo "Captures : $OBTENU / $ATTENDU"
          if [ "$OBTENU" -lt "$ATTENDU" ]; then
            echo "ÉCHEC : captures manquantes — le build doit être rouge, pas un zip vide."
            exit 1
          fi
          zip -r captures.zip captures

    artifacts:
      - captures.zip
